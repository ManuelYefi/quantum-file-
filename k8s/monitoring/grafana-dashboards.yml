apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: quantum-processing
  labels:
    app: grafana
    app.kubernetes.io/part-of: quantum-file-processor
data:
  quantum-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "panels": [
        {
          "title": "Chunks Processed",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": "Prometheus",
          "targets": [{ "expr": "chunks_processed_total" }]
        },
        {
          "title": "Lines Processed",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": "Prometheus",
          "targets": [{ "expr": "lines_processed_total" }]
        },
        {
          "title": "Queue Depth",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": "Prometheus",
          "targets": [{ "expr": "amq_queue_depth" }]
        },
        {
          "title": "DLQ Messages",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": "Prometheus",
          "targets": [{ "expr": "amq_dlq_depth" }]
        },
        {
          "title": "Processing Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": "Prometheus",
          "targets": [
            { "expr": "rate(chunks_processed_total[5m]) * 60", "legendFormat": "chunks/min" }
          ]
        },
        {
          "title": "Processing Latency",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": "Prometheus",
          "targets": [
            { "expr": "histogram_quantile(0.95, rate(chunk_processing_time_seconds_bucket[5m]))", "legendFormat": "p95" }
          ]
        }
      ],
      "title": "Quantum File Processor",
      "uid": "quantum-overview"
    }
