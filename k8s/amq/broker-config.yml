apiVersion: v1
kind: ConfigMap
metadata:
  name: amq-broker-config
  namespace: quantum-processing
  labels:
    app: amq-broker
    app.kubernetes.io/part-of: quantum-file-processor
data:
  broker.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration xmlns="urn:activemq"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="urn:activemq /schema/artemis-configuration.xsd">
      <core xmlns="urn:activemq:core">

        <persistence-enabled>true</persistence-enabled>
        <journal-type>NIO</journal-type>
        <journal-directory>./data/journal</journal-directory>
        <paging-directory>./data/paging</paging-directory>
        <bindings-directory>./data/bindings</bindings-directory>
        <large-messages-directory>./data/large-messages</large-messages-directory>

        <journal-min-files>2</journal-min-files>
        <journal-pool-files>10</journal-pool-files>
        <journal-buffer-size>1048576</journal-buffer-size>

        <acceptors>
          <acceptor name="artemis">tcp://0.0.0.0:61616?tcpSendBufferSize=1048576;tcpReceiveBufferSize=1048576;protocols=CORE,AMQP;useEpoll=true</acceptor>
          <acceptor name="amqp">tcp://0.0.0.0:5672?tcpSendBufferSize=1048576;tcpReceiveBufferSize=1048576;protocols=AMQP</acceptor>
        </acceptors>

        <address-settings>
          <!-- Default settings for all addresses -->
          <address-setting match="#">
            <dead-letter-address>DLQ</dead-letter-address>
            <expiry-address>ExpiryQueue</expiry-address>
            <redelivery-delay>5000</redelivery-delay>
            <max-delivery-attempts>5</max-delivery-attempts>
            <max-size-bytes>104857600</max-size-bytes>
            <page-size-bytes>10485760</page-size-bytes>
            <message-counter-history-day-limit>10</message-counter-history-day-limit>
            <address-full-policy>PAGE</address-full-policy>
            <auto-create-queues>true</auto-create-queues>
            <auto-create-addresses>true</auto-create-addresses>
          </address-setting>

          <!-- Specific settings for chunk processing queue -->
          <address-setting match="quantum.file.chunks">
            <dead-letter-address>DLQ.quantum.file.chunks</dead-letter-address>
            <redelivery-delay>5000</redelivery-delay>
            <redelivery-delay-multiplier>2.0</redelivery-delay-multiplier>
            <max-redelivery-delay>60000</max-redelivery-delay>
            <max-delivery-attempts>5</max-delivery-attempts>
            <max-size-bytes>524288000</max-size-bytes>
            <page-size-bytes>10485760</page-size-bytes>
            <address-full-policy>PAGE</address-full-policy>
            <redistribution-delay>1000</redistribution-delay>
          </address-setting>

          <!-- Result queue settings -->
          <address-setting match="quantum.file.results">
            <dead-letter-address>DLQ</dead-letter-address>
            <max-delivery-attempts>3</max-delivery-attempts>
            <redelivery-delay>2000</redelivery-delay>
          </address-setting>
        </address-settings>

        <addresses>
          <address name="quantum.file.chunks">
            <anycast>
              <queue name="quantum.file.chunks"/>
            </anycast>
          </address>
          <address name="quantum.file.results">
            <anycast>
              <queue name="quantum.file.results"/>
            </anycast>
          </address>
          <address name="quantum.file.notifications">
            <multicast>
              <queue name="quantum.file.notifications"/>
            </multicast>
          </address>
          <address name="DLQ">
            <anycast>
              <queue name="DLQ"/>
            </anycast>
          </address>
          <address name="DLQ.quantum.file.chunks">
            <anycast>
              <queue name="DLQ.quantum.file.chunks"/>
            </anycast>
          </address>
          <address name="ExpiryQueue">
            <anycast>
              <queue name="ExpiryQueue"/>
            </anycast>
          </address>
        </addresses>

      </core>
    </configuration>
