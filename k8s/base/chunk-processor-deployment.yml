apiVersion: apps/v1
kind: Deployment
metadata:
  name: chunk-processor
  namespace: quantum-processing
  labels:
    app: chunk-processor
    app.kubernetes.io/part-of: quantum-file-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chunk-processor
  template:
    metadata:
      labels:
        app: chunk-processor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: chunk-processor
          image: quantum/chunk-processor:latest
          ports:
            - containerPort: 8082
              name: http
          envFrom:
            - configMapRef:
                name: quantum-config
            - secretRef:
                name: quantum-secrets
          env:
            - name: SERVER_PORT
              value: "8082"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chunk-processor
  namespace: quantum-processing
  labels:
    app: chunk-processor
spec:
  selector:
    app: chunk-processor
  ports:
    - port: 8082
      targetPort: 8082
      name: http
